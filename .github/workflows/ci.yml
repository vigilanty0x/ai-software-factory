name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned build backend
        run: python -m pip install --disable-pip-version-check "setuptools==80.9.0"
      - name: Build wheel and source distribution
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          python -c "from setuptools.build_meta import build_sdist; print(build_sdist('dist'))"
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', '--no-deps', '--force-reinstall', glob.glob('dist/*.whl')[0]])"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Run repository checks
        run: python scripts/check.py
      - name: Smoke-test installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: ai-software-factory --help
