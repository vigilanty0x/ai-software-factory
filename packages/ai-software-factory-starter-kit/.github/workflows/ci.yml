name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==80.9.0" "wheel==0.45.1"
          python -m build --no-isolation
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Import installed package
        run: |
          python - <<'PY'
          import importlib
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              name = tomllib.load(handle)["project"]["name"]
          importlib.import_module(name.replace("-", "_"))
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository checks
        run: python scripts/check.py
      - name: Installed CLI example smoke
        run: |
          cli=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          "$cli" examples/valid.json > /tmp/example-result.json
          python -c 'import json; assert json.load(open("/tmp/example-result.json"))["status"] == "passed"'
      - name: Malformed CLI input fails closed
        run: |
          cli=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          echo '{' > /tmp/invalid.json
          set +e
          "$cli" /tmp/invalid.json > /tmp/invalid-result.json
          status=$?
          set -e
          test "$status" -eq 2
          python -c 'import json; assert json.load(open("/tmp/invalid-result.json"))["status"] == "failed"'

